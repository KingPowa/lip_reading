<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Speaker Captions</title>
<style>
  html,body{margin:0;height:100%;background:#0f1115;color:#e6e8ee;font:15px -apple-system,BlinkMacSystemFont,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;-webkit-app-region:drag}
  h1{margin:0;font-size:26px;font-weight:600}
  p{margin:0;color:#9aa1b2;text-align:center;max-width:620px;line-height:1.45}
  .spin{width:34px;height:34px;border:3px solid #2a2f3a;border-top-color:#6ea8ff;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  pre{width:min(820px,90vw);height:200px;overflow:auto;margin:6px 0 0;padding:10px;background:#161a22;border-radius:8px;color:#aab2c5;font:12px ui-monospace,Menlo,monospace;white-space:pre-wrap;-webkit-app-region:no-drag}
  button{display:none;padding:8px 22px;border:0;border-radius:8px;background:#6ea8ff;color:#0f1115;font-size:15px;font-weight:600;cursor:pointer;-webkit-app-region:no-drag}
  .err h1{color:#ff7b7b}.err .spin{display:none}.err button{display:block}
</style></head>
<body>
  <div class="spin"></div>
  <h1 id="title">Speaker Captions</h1>
  <p id="msg">Starting speech and face models… first launch can take a few minutes.</p>
  <button id="retry">Retry</button>
  <pre id="log"></pre>
<script>
  const log = document.getElementById("log");
  window.shell.onLog((lines) => { log.textContent = lines.join("\n"); log.scrollTop = log.scrollHeight; });
  window.shell.onError((info) => {
    document.body.classList.add("err");
    document.getElementById("title").textContent = info.title || "Something went wrong";
    document.getElementById("msg").textContent = info.message || "";
    if (info.lines) { log.textContent = info.lines.join("\n"); log.scrollTop = log.scrollHeight; }
  });
  document.getElementById("retry").onclick = () => {
    document.body.classList.remove("err");
    document.getElementById("title").textContent = "Speaker Captions";
    document.getElementById("msg").textContent = "Starting speech and face models… first launch can take a few minutes.";
    window.shell.retry();
  };
  window.shell.ready();
</script></body></html>
