[project]
name = "active-speaker-captioning"
version = "0.1.0"
description = "Local video and camera active-speaker captioning"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mediapipe==0.10.21",
    "numpy>=1.26,<2",
    "faster-whisper==1.2.1",
    "vosk==0.3.42; sys_platform == 'darwin'",
    "vosk==0.3.45; sys_platform != 'darwin'",
    "openai-whisper>=20250625",
    "opencv-python-headless>=4.10,<5",
    "pillow>=12,<13",
    "python-speech-features>=0.6",
    "speechbrain>=1.1.1",
]

[project.scripts]
live-speaker = "src.app.live:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
