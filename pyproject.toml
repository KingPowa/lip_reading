[project]
name = "active-speaker-captioning"
version = "0.1.0"
description = "A small prerecorded-video active-speaker captioning MVP"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mediapipe==0.10.21",
    "numpy>=1.26,<2",
    "openai-whisper>=20250625",
    "opencv-python-headless>=4.10,<5",
    "pillow>=12,<13",
    "python-speech-features>=0.6",
    "speechbrain>=1.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
